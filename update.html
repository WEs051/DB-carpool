<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Update Student Record</title>

    <link rel="stylesheet" href="index.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<header>
    <h1>Update Student Record</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="rider.html">Register as Rider</a>
        <a href="provider.html">Register as Provider</a>
        <a href="match.html">Find Matches</a>
    </nav>
</header>

<main class="container my-4">

    <section>
        <h2 class="mb-4">Modify Student Information</h2>

        <div class="card-custom">

            <form action="update.php" method="POST">

                <div class="mb-3">
                    <label class="form-label">Student ID</label>
                    <input type="number" name="studentID" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Height (optional)</label>
                    <input type="number" name="height" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">New Postal Code (optional)</label>
                    <input type="text" name="postalCode" class="form-control">
                </div>

                <button type="submit" class="btn-orange">Update Record</button>

            </form>

        </div>
    </section>

</main>

<footer>
    <small>CPSC 2221 – Carpooling Project</small>
</footer>
