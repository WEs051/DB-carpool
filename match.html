
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Matches – Carpooling</title>

    <link rel="stylesheet" href="index.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

    <header>
        <h1>Find Carpool Matches</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="rider.html">Register as Rider</a>
            <a href="provider.html">Register as Provider</a>
        </nav>
    </header>

    <main class="container my-4">

        <section>
            <h2 class="mb-4">Search by Section</h2>

            <div class="card-custom mb-4">

                <form action="match.php" method="get">

                    <!-- ROLE -->
                    <div class="mb-3">
                        <label for="role" class="form-label">I am a…</label>
                        <select id="role" name="role" class="form-select">
                            <option value="rider">Rider (Find Providers)</option>
                            <option value="provider">Provider (Find Riders)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="section" class="form-label">Select Section</label>
                        <select id="section" name="section" class="form-select">
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="time" class="form-label">Arrival Time (optional)</label>
                        <input type="time" id="time" name="time" class="form-control">
                    </div>

                    <button type="submit" class="btn-orange">Search Matches</button>
                </form>

            </div>

            <div id="results"></div>

        </section>
    </main>

    <footer>
        <small>CPSC 2221 – Carpooling Project</small>
    </footer>

</body>
</html>
